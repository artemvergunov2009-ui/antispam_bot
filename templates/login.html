<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samberrrgram - Вход</title>
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfaf5, #f5eee6);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }
        .login-container {
            background: #ffffff; padding: 40px;
            border-radius: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center; width: 300px;
        }
        h1 { color: #d1a982; margin-bottom: 30px; }
        input {
            width: 100%; padding: 15px; margin-bottom: 15px;
            border: 1px solid rgba(0,0,0,0.08); border-radius: 15px;
            box-sizing: border-box; background: #fcf9f5;
            outline: none; font-size: 16px; transition: 0.3s;
        }
        input:focus { border-color: #d1a982; }
        button {
            width: 100%; padding: 15px; background: #d1a982;
            color: white; border: none; border-radius: 15px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #b8916b; transform: scale(1.02); }
        .error { color: #e57373; margin-bottom: 15px; font-weight: bold; }
    </style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

</head>
<body>
    <div class="login-container">
        <h1>Samberrrgram</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Логин" required autocomplete="off">
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти / Регистрация</button>
        </form>
    </div>

    <div id="qr-container" style="text-align: center; margin-top: 20px;">
    <button type="button" onclick="generateQR()" style="padding: 10px; background: var(--main-color, #d1a982); color: white; border: none; border-radius: 10px; cursor: pointer;">
        Вход по QR-коду
    </button>
    <div id="qr-box" style="display: none; margin-top: 15px;">
        <p style="color: #888; font-size: 14px;">Отсканируйте код через приложение на телефоне</p>
        <img id="qr-image" src="" alt="QR" style="border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    </div>
</div>
<script>
    const socket = io();

    function generateQR() {
        document.getElementById('qr-box').style.display = 'block';
        document.getElementById('qr-image').src = "https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif"; // Гифка загрузки
        socket.emit('request_qr'); // Просим сервер дать токен
    }

    // Сервер сгенерировал токен — рисуем картинку!
    socket.on('qr_generated', (data) => {
        // Мы используем публичный генератор, который превратит наш длинный токен в картинку QR-кода
        document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${data.token}&color=3e2723`;
    });

    // Телефон подтвердил код — нас пускают!
    socket.on('qr_approved', (data) => {
        document.getElementById('qr-box').innerHTML = "<h3 style='color: #4CAF50;'>Успешно! Входим...</h3>";
        window.location.href = `/qr_login_execute?token=${data.token}`;
    });
</script>
</body>
</html>
