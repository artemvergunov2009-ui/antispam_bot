<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в Samberrrgram</title>
    <style>
:root{
    --bg:#0e0f11;
    --card:#1a1b1f;
    --accent:#2b5278;
    --accent2:#3a6ea5;
    --text:#ffffff;
    --muted:#9aa3ad;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
        linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.7)),
        url('https://wallpapercave.com/wp/wp4015841.jpg');
    background-size:cover;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.login-card{
    width:370px;
    background:rgba(24,24,26,.72);
    backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,.05);
    border-radius:32px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.logo{
    font-size:38px;
    font-weight:800;
    color:white;
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    color:var(--muted);
    text-align:center;
    margin-bottom:35px;
}

input{
    width:100%;
    height:55px;
    border:none;
    outline:none;
    margin-bottom:14px;
    border-radius:18px;
    padding:0 18px;
    background:#111216;
    color:white;
    font-size:15px;
}

input:focus{
    border:1px solid var(--accent2);
}

button{
    width:100%;
    height:55px;
    border:none;
    border-radius:18px;
    background:var(--accent);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:var(--accent2);
    transform:translateY(-1px);
}

.hint{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    margin-top:20px;
    line-height:1.5;
}

.error-msg{
    background:#ff4d4f22;
    color:#ff7b7b;
    padding:12px;
    border-radius:14px;
    margin-bottom:15px;
    text-align:center;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

</head>
<body>
    <div class="login-card">
        <div class="logo">Samberrrgram</div>
        <div class="subtitle">Твой уютный мессенджер</div>
        
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <input type="text" name="username" placeholder="Никнейм" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Пароль" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        
        <div class="hint">
            Новый здесь? Просто введи ник и пароль — аккаунт создастся автоматически.
        </div>
    </div>

<div id="qr-container" style="text-align: center; margin-top: 20px;">
    <button type="button" onclick="generateQR()" style="padding: 10px; background: var(--main-color, #d1a982); color: white; border: none; border-radius: 10px; cursor: pointer;">
        Вход по QR-коду
    </button>
    <div id="qr-box" style="display: none; margin-top: 15px;">
        <p style="color: #888; font-size: 14px;">Отсканируйте код через приложение на телефоне</p>
        <img id="qr-image" src="" alt="QR" style="border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    </div>
</div>
   
    <script>
    const socket = io();

    function generateQR() {
        document.getElementById('qr-box').style.display = 'block';
        document.getElementById('qr-image').src = "https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif"; // Гифка загрузки
        socket.emit('request_qr'); // Просим сервер дать токен
    }

    // Сервер сгенерировал токен — рисуем картинку!
    socket.on('qr_generated', (data) => {
        // Мы используем публичный генератор, который превратит наш длинный токен в картинку QR-кода
        document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${data.token}&color=3e2723`;
    });

    // Телефон подтвердил код — нас пускают!
    socket.on('qr_approved', (data) => {
        document.getElementById('qr-box').innerHTML = "<h3 style='color: #4CAF50;'>Успешно! Входим...</h3>";
        window.location.href = `/qr_login_execute?token=${data.token}`;
    });
</script>

</body>
</html>
