<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samberrrgram</title>
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        :root {
            /* Улучшенная версия твоей палитры */
            --bg-color: #fdfaf5; 
            --sidebar-bg: #ffffff; 
            --chat-area-bg: #f9f5f0;
            --main-color: #d1a982; 
            --main-hover: #b8926a;
            --text-primary: #2d2a26;
            --text-secondary: #8c8378;
            --message-sent-bg: #d1a982;
            --message-sent-text: #ffffff;
            --message-received-bg: #ffffff;
            --message-received-text: #2d2a26;
            --border-color: #eae3d9;
            --shadow-sm: 0 2px 8px rgba(209, 169, 130, 0.1);
            --shadow-md: 0 8px 24px rgba(209, 169, 130, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Главный контейнер */
        .app-container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-color);
            box-shadow: var(--shadow-md);
        }

        /* --- БОКОВАЯ ПАНЕЛЬ (Сайдбар) --- */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.2s;
            padding: 8px;
        }

        .icon-btn:hover {
            color: var(--main-color);
        }

        .search-bar {
            padding: 15px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .search-wrapper {
            background: var(--bg-color);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
        }

        .search-wrapper i {
            color: var(--text-secondary);
            margin-right: 10px;
            font-size: 14px;
        }

        .search-wrapper input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
            color: var(--text-primary);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid var(--bg-color);
        }

        .chat-item:hover {
            background: var(--bg-color);
        }

        .chat-item.active {
            background: rgba(209, 169, 130, 0.1);
            border-left: 4px solid var(--main-color);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--main-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .chat-info {
            flex: 1;
            overflow: hidden;
        }

        .chat-name-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .chat-name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .chat-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- ЗОНА ЧАТА --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-area-bg);
            position: relative;
        }

        .chat-header {
            padding: 15px 25px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .chat-header .avatar {
            width: 42px;
            height: 42px;
            font-size: 16px;
        }

        .chat-header .status {
            font-size: 13px;
            color: var(--main-color);
            font-weight: 500;
            margin-top: 2px;
        }

        .messages-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: var(--shadow-sm);
        }

        .message.received {
            align-self: flex-start;
            background: var(--message-received-bg);
            color: var(--message-received-text);
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--message-sent-bg);
            color: var(--message-sent-text);
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            float: right;
            margin-top: 8px;
            margin-left: 12px;
        }

        /* --- ПОЛЕ ВВОДА --- */
        .input-area {
            padding: 15px 25px;
            background: var(--sidebar-bg);
            display: flex;
            align-items: center;
            gap: 15px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            flex: 1;
            background: var(--bg-color);
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 5px 20px;
            border: 1px solid var(--border-color);
        }

        .input-wrapper input {
            width: 100%;
            padding: 10px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
            color: var(--text-primary);
        }

        .btn-send {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--main-color);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            box-shadow: var(--shadow-sm);
        }

        .btn-send:hover {
            background: var(--main-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* --- МОДАЛЬНЫЕ ОКНА И TOASTS --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 42, 38, 0.6);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--sidebar-bg);
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .close-btn {
            background: var(--bg-color);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: 0.2s;
        }

        .close-btn:hover {
            background: #ffebe6;
            color: #d9534f;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(45, 42, 38, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: var(--shadow-md);
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                width: 100%;
                z-index: 20;
                /* Скрывать/показывать сайдбар через JS добавляя класс .hidden */
            }
            .sidebar.hidden {
                transform: translateX(-100%);
            }
            .chat-area {
                width: 100%;
            }
            .message {
                max-width: 85%;
            }
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(209, 169, 130, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--main-color); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Samberrrgram</h2>
                <button onclick="openModal('qrScannerModal')" class="icon-btn" title="Авторизовать ПК">
                    <i class="fas fa-qrcode"></i>
                </button>
            </div>
            <div class="search-bar">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Поиск контактов...">
                </div>
            </div>
            
            <div class="chat-list">
                <div class="chat-item active">
                    <div class="avatar">Н</div>
                    <div class="chat-info">
                        <div class="chat-name-row">
                            <span class="chat-name">NEXUS AI Bot</span>
                            <span class="chat-time">14:20</span>
                        </div>
                        <div class="chat-preview">Токен успешно привязан!</div>
                    </div>
                </div>
                
                <div class="chat-item">
                    <div class="avatar" style="background: #b8926a;">M</div>
                    <div class="chat-info">
                        <div class="chat-name-row">
                            <span class="chat-name">Максим Маратович</span>
                            <span class="chat-time">Вчера</span>
                        </div>
                        <div class="chat-preview">Проект принят. Отличная работа!</div>
                    </div>
                </div>
                </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="avatar">Н</div>
                <div class="chat-info">
                    <div class="chat-name" style="font-weight: 600; font-size: 16px;">NEXUS AI Bot</div>
                    <div class="status">печатает...</div>
                </div>
                <button class="icon-btn"><i class="fas fa-ellipsis-v"></i></button>
            </div>
            
            <div class="messages-container" id="chat-box">
                <div class="message received">
                    Привет! Готов к вайб-кодингу? Запускаем Flask-сервер? 🚀
                    <span class="message-time">14:18</span>
                </div>
                
                <div class="message sent">
                    Да, дизайн уже обновил. Смотрится пушечно! 😎
                    <span class="message-time">14:20</span>
                </div>
                </div>

            <div class="input-area">
                <button class="icon-btn"><i class="fas fa-paperclip"></i></button>
                <div class="input-wrapper">
                    <input type="text" id="message-input" placeholder="Написать сообщение...">
                    <button class="icon-btn" style="padding: 0;"><i class="far fa-smile"></i></button>
                </div>
                <button class="btn-send"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <div id="qrScannerModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-weight: 600;">Сканер QR-кода</h3>
                <button onclick="closeScanner()" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div id="qr-reader" style="width: 100%; border-radius: 15px; overflow: hidden; border: 2px solid var(--border-color);"></div>
        </div>
    </div>

    <script>
        const socket = io();
        // Вставляем текущего пользователя из Jinja (Flask)
        let currentUser = "{{ current_user.username if current_user.is_authenticated else 'Guest' }}"; 
        let html5QrcodeScanner;

        // --- Управление модальными окнами ---
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
            if (modalId === 'qrScannerModal') {
                initScanner();
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // --- Система Toast-уведомлений ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            
            container.appendChild(toast);
            
            // Удаляем через 3 секунды
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // --- Логика QR Сканера ---
        function initScanner() {
            // Запускаем камеру и сканер
            html5QrcodeScanner = new Html5QrcodeScanner(
                "qr-reader", { fps: 10, qrbox: {width: 250, height: 250} }, /* verbose= */ false);
                
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function closeScanner() {
            closeModal('qrScannerModal');
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(error => {
                    console.error("Ошибка остановки сканера", error);
                });
                html5QrcodeScanner = null;
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            console.log("Распознан токен:", decodedText);
            closeScanner();
            showToast("QR-код распознан! Авторизуем ПК...");
            
            // ЯВНО передаем твой никнейм
            socket.emit('approve_qr', { 
                token: decodedText.trim(),
                username: currentUser 
            });
        }

        function onScanFailure(error) {
            // Игнорируем постоянные ошибки поиска кода, чтобы не засорять консоль
        }
    </script>
</body>
</html>
